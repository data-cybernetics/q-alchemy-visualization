[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-alchemy-visualization"
version = "0.1.0"
description = "Renderer-neutral experiment diagrams and text/Matplotlib renderers for Q-Alchemy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mpl = ["matplotlib>=3.8"]
dev = ["pytest>=9.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
