name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      upload_to_internal_feed:
        type: boolean
        description: Upload to internal feed
        default: false
  push:
    branches:
      - main
      - feature/*

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build wheel + sdist
        run: uv build --no-config
      - name: Upload artifact
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: q-alchemy-visualization-dist
          path: ./dist
          retention-days: 1

  test:
    name: Test installed wheel
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download dist
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: q-alchemy-visualization-dist
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Validate distributions
        run: |
          python -m pip install twine
          python -m twine check ./dist/*
      - name: Install wheel + test dependencies
        run: |
          set -euo pipefail
          uv venv .venv
          WHEEL="$(find dist -maxdepth 1 -name 'q_alchemy_visualization-*.whl' -print -quit)"
          test -n "$WHEEL"
          uv pip install --python .venv "${WHEEL}[dev]"
          uv pip check --python .venv
      - name: Verify installed package
        run: |
          .venv/bin/python - <<'PY'
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import q_alchemy
          import q_alchemy.visualization

          assert q_alchemy.__file__ is None
          installed = Path(q_alchemy.visualization.__file__).resolve()
          assert installed.is_relative_to(Path(sys.prefix).resolve())
          print("q-alchemy-visualization:", version("q-alchemy-visualization"))
          PY
      - name: Run tests against installed wheel
        run: .venv/bin/python -m pytest -v -o pythonpath=

  publish:
    if: |
        (github.ref == 'refs/heads/main' || github.ref == 'main' || github.ref_name == 'main') &&
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.upload_to_internal_feed == true ||
          github.event.inputs.upload_to_internal_feed == true ||
          github.event.inputs.upload_to_internal_feed == 'true'
        )
    name: Publish to internal packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download dist
        uses: christopherhx/gitea-download-artifact@v4
        with:
          name: q-alchemy-visualization-dist
          path: dist/
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Publish
        run: |
          python -m pip install twine
          python -m twine check ./dist/*
          python -m twine upload \
            --repository-url https://devops.data-cybernetics.net/api/packages/qalchemy/pypi \
            --non-interactive \
            ./dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PACKAGES_PAT }}
