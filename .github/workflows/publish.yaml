name: Publish to PyPI

# One-time PyPI setup:
#   project: q-alchemy-visualization
#   owner: data-cybernetics
#   repository: q-alchemy-visualization
#   workflow: publish.yaml
#   environment: pypi
# Also create the `pypi` GitHub environment, optionally with required reviewers.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v${PACKAGE_VERSION}" != "${RELEASE_TAG}" ] && [ "${PACKAGE_VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package version '${PACKAGE_VERSION}'"
            exit 1
          fi
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/q-alchemy-visualization
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
