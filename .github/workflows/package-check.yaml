name: Package check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        uses: hynek/build-and-inspect-python-package@v3.0.1

  test:
    name: Test installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install built wheel and test dependencies
        run: |
          uv venv --python "${{ matrix.python-version }}"
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          uv pip install "${WHEEL}[dev]"
          uv pip check --python .venv
      - name: Verify installed namespace package
        run: |
          .venv/bin/python - <<'PYTHON'
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import q_alchemy
          import q_alchemy.visualization

          assert q_alchemy.__file__ is None
          installed = Path(q_alchemy.visualization.__file__).resolve()
          assert installed.is_relative_to(Path(sys.prefix).resolve())
          assert "matplotlib" not in sys.modules
          assert (installed.parent / "py.typed").is_file()
          print("q-alchemy-visualization:", version("q-alchemy-visualization"))
          PYTHON
      - name: Run tests against installed wheel
        run: .venv/bin/python -m pytest -v -o pythonpath= tests
